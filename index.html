:root {

*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:14px;color:var(--ink);}
body{background:var(--light);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

/* ── top nav ── */
.nav{
  background:var(--black);

  border-bottom:2px solid var(--red);
}
.nav-brand{
  font-family:'Noto Serif KR',serif;
  font-size:15px;font-weight:700;color:#fff;
  letter-spacing:0.5px;
}
.nav-brand span{color:var(--red);margin-right:8px;}
.nav-meta{font-size:10px;color:#666;letter-spacing:2px;}

/* ── hero strip ── */
.hero{
  background:var(--ink);
  padding:40px 40px 32px;
  border-bottom:1px solid #2a2a2a;
}
.hero-label{font-size:9px;letter-spacing:4px;color:#555;text-transform:uppercase;margin-bottom:10px;}
.hero-title{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:18px;}
.hero-title em{color:var(--red);font-style:normal;}

/* ── latest banner ── */
.latest-banner{
  background:#1a1a1a;
  border:1px solid #2a2a2a;
  border-left:3px solid var(--red);
  padding:18px 24px;
  display:flex;align-items:center;gap:20px;
  cursor:pointer;transition:background .15s;
}
.latest-banner:hover{background:#222;}
.latest-tag{font-size:9px;letter-spacing:3px;color:var(--red);text-transform:uppercase;white-space:nowrap;}
.latest-issue{font-size:11px;color:#666;margin:3px 0;}
.latest-headline{font-size:13px;font-weight:700;color:#ddd;}
.latest-kws{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.latest-kw{font-size:9px;background:#2a2a2a;color:#aaa;padding:2px 7px;border-radius:2px;}
.latest-arrow{margin-left:auto;color:var(--red);font-size:18px;flex-shrink:0;}

/* ── controls ── */
.controls{
  background:var(--white);
  border-bottom:1px solid var(--border);
  padding:16px 40px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
#q{
  border:1px solid var(--border);background:var(--light);
  padding:7px 12px;font-size:12px;font-family:inherit;color:var(--ink);
  outline:none;border-radius:2px;width:200px;
  transition:border .15s;
}
#q:focus{border-color:var(--red);}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.ftag{
  font-size:10px;padding:4px 10px;border-radius:2px;
  border:1px solid var(--border);background:var(--white);
  color:var(--muted);cursor:pointer;transition:all .12s;font-family:inherit;
}
.ftag:hover{border-color:var(--red);color:var(--red);}
.ftag.on{background:var(--red);color:#fff;border-color:var(--red);}
.count{margin-left:auto;font-size:11px;color:var(--muted);}

/* ── main ── */
.main{max-width:1100px;margin:0 auto;padding:32px 40px;}

/* ── month group ── */
.month-group{margin-bottom:36px;}
.month-label{
  font-size:11px;font-weight:700;color:var(--red);
  letter-spacing:2px;text-transform:uppercase;
  padding-bottom:10px;border-bottom:2px solid var(--red);
  margin-bottom:18px;
}

/* ── grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

/* ── card ── */
.card{
  background:var(--white);border:1px solid var(--border);
  display:flex;flex-direction:column;
  text-decoration:none;color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
  animation:fadeUp .3s ease both;
}
.card:hover{border-color:var(--red);box-shadow:0 2px 12px rgba(192,57,43,.08);}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-head{
  padding:10px 14px 8px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--light);
}
.card-vol{font-size:10px;font-weight:700;color:var(--red);letter-spacing:1px;}
.card-date{font-size:10px;color:var(--muted);}
.card-body{padding:14px;flex:1;}
.card-week{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
.card-title{font-size:13px;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:7px;}
.card-summary{font-size:11px;color:var(--mid);line-height:1.7;margin-bottom:10px;}
.card-kws{display:flex;gap:4px;flex-wrap:wrap;}
.card-kw{font-size:9px;background:var(--light);color:var(--muted);padding:2px 6px;border-radius:2px;}
.card-foot{
  padding:10px 14px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-dots{display:flex;gap:3px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border);}
.dot.on{background:var(--red);}
.card-cta{font-size:10px;color:var(--red);font-weight:700;letter-spacing:1px;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty p{font-size:13px;margin-top:8px;}

/* ── footer ── */
.footer{

.footer-brand{font-family:'Noto Serif KR',serif;color:#888;font-size:12px;}

}

function matchFilter(n){
  if(filter === "전체") return true;
  return n.tags && n.tags.includes(filter);
}

function matchQuery(n){
  if(!query) return true;
  const q = query.toLowerCase();
  return (
    n.title.toLowerCase().includes(q) ||
    n.summary.toLowerCase().includes(q) ||
    n.keywords.some(k=>k.toLowerCase().includes(q)) ||
    n.issue.includes(q)
  );
}

function openLatest(){
  if(ISSUES.length) window.open(ISSUES[0].file,"_blank");
}

// ─────────────────────────────────────────
//  Render
// ─────────────────────────────────────────
function render(){
  const filtered = ISSUES.filter(n => matchFilter(n) && matchQuery(n));

  // update count
  document.getElementById("cnt").textContent = `${filtered.length}개 호`;

  // group by month
  const groups = {};
  filtered.forEach(n=>{
    const k = monthKey(n.date);
    if(!groups[k]) groups[k] = [];
    groups[k].push(n);
  });

  // update latest banner
  const latest = ISSUES[0];
  document.getElementById("l-issue").textContent = `VOL.${latest.vol} · ${latest.issue} · ${fmt(latest.date)}`;
  document.getElementById("l-title").textContent = latest.title;
  document.getElementById("l-kws").innerHTML = latest.keywords.slice(0,5).map(k=>`<span class="latest-kw">${k}</span>`).join("");

  // render main
  const main = document.getElementById("main");
  if(filtered.length === 0){
    main.innerHTML = `<div class="empty"><div style="font-size:32px">📭</div><p>검색 결과가 없습니다.</p></div>`;
    return;
  }

  main.innerHTML = Object.keys(groups).map(m => `
    <div class="month-group">
      <div class="month-label">${m} — ${groups[m].length}개 호</div>
      <div class="grid">
        ${groups[m].map((n, idx) => `
          <a class="card" href="${n.file}" target="_blank" style="animation-delay:${idx*0.05}s">
            <div class="card-head">
              <span class="card-vol">VOL.${n.vol}</span>
              <span class="card-date">${fmt(n.date)}</span>
            </div>
            <div class="card-body">
              <div class="card-week">${n.weekLabel}</div>
              <div class="card-title">${n.title}</div>
              <div class="card-summary">${n.summary}</div>
              <div class="card-kws">${n.keywords.slice(0,4).map(k=>`<span class="card-kw">${k}</span>`).join("")}</div>
            </div>
            <div class="card-foot">
              <div class="card-dots">${n.sections.map(s=>`<div class="dot${s?" on":""}"></div>`).join("")}</div>
              <span class="card-cta">열람 →</span>
            </div>
          </a>
        `).join("")}
      </div>
    </div>
  `).join("");
}

// ─────────────────────────────────────────
//  Events
// ─────────────────────────────────────────
document.querySelectorAll(".ftag").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".ftag").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  render();
}));

let t;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(t);
  t = setTimeout(()=>{ query = e.target.value; render(); }, 160);
});

// init
render();
</script>
</body>
</html>
